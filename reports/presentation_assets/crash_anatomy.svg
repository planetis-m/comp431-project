<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of the HTTP slash crash</title>
  <desc id="desc">Diagram explaining why HTTP slash reaches the end of string, the dot skip moves past the end, and IndexDefect is raised.</desc>
  <rect width="1280" height="720" fill="#fbfaf7"/>
  <text x="70" y="86" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#172033">Confirmed crash: protocol token is too short</text>
  <text x="72" y="126" font-family="Inter, Arial, sans-serif" font-size="22" fill="#5b6170">The prefix check passes, then an unconditional dot skip moves the index out of range.</text>

  <g font-family="Inter, Arial, sans-serif">
    <text x="106" y="238" font-size="30" font-weight="700" fill="#172033">Input payload</text>
    <rect x="106" y="264" width="520" height="96" rx="8" fill="#ffffff" stroke="#bcc5d6" stroke-width="3"/>
    <text x="142" y="326" font-size="42" font-family="JetBrains Mono, Consolas, monospace" fill="#172033">H T T P /</text>
    <text x="148" y="386" font-size="20" fill="#5b6170">indexes: 0 1 2 3 4</text>

    <rect x="712" y="210" width="430" height="88" rx="8" fill="#ffffff" stroke="#bcc5d6" stroke-width="3"/>
    <text x="746" y="264" font-size="26" font-family="JetBrains Mono, Consolas, monospace" fill="#172033">skipIgnoreCase("HTTP/") = 5</text>

    <rect x="712" y="334" width="430" height="88" rx="8" fill="#fff4e0" stroke="#d9922b" stroke-width="3"/>
    <text x="746" y="388" font-size="26" font-family="JetBrains Mono, Consolas, monospace" fill="#172033">i == protocol.len</text>

    <rect x="712" y="458" width="430" height="88" rx="8" fill="#ffecec" stroke="#c84141" stroke-width="3"/>
    <text x="746" y="512" font-size="26" font-family="JetBrains Mono, Consolas, monospace" fill="#172033">unconditional dot skip</text>

    <rect x="342" y="502" width="300" height="92" rx="8" fill="#ffecec" stroke="#c84141" stroke-width="3"/>
    <text x="389" y="558" font-size="30" font-weight="700" fill="#172033">IndexDefect</text>

    <path d="M626 312 C670 312 674 254 704 254" stroke="#3267d6" stroke-width="6" fill="none"/>
    <path d="M927 298 L927 322" stroke="#3267d6" stroke-width="6" fill="none"/>
    <path d="M927 422 L927 446" stroke="#c84141" stroke-width="6" fill="none"/>
    <path d="M712 506 C666 506 668 548 652 548" stroke="#c84141" stroke-width="6" fill="none"/>
  </g>
</svg>
