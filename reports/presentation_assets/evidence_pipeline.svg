<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Evidence pipeline for security findings</title>
  <desc id="desc">Diagram showing AI or human hypothesis, reproducer, fuzzing, fix, and replay.</desc>
  <rect width="1280" height="720" fill="#fbfaf7"/>
  <text x="70" y="86" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#172033">Best workflow: hypothesis to replayed fix</text>
  <text x="72" y="126" font-family="Inter, Arial, sans-serif" font-size="22" fill="#5b6170">A finding should move from idea to reproducible evidence before it is called confirmed.</text>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3267d6"/>
    </marker>
  </defs>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="78" y="294" width="190" height="116" rx="10" fill="#ffffff" stroke="#b7c2d8" stroke-width="3"/>
    <text x="123" y="344" font-size="26" font-weight="700" fill="#172033">Hypothesis</text>
    <text x="124" y="380" font-size="20" fill="#546179">AI or human</text>

    <rect x="328" y="294" width="190" height="116" rx="10" fill="#ffffff" stroke="#b7c2d8" stroke-width="3"/>
    <text x="384" y="344" font-size="26" font-weight="700" fill="#172033">Testcase</text>
    <text x="370" y="380" font-size="20" fill="#546179">exact input</text>

    <rect x="578" y="294" width="190" height="116" rx="10" fill="#ffffff" stroke="#b7c2d8" stroke-width="3"/>
    <text x="635" y="344" font-size="26" font-weight="700" fill="#172033">Crash?</text>
    <text x="606" y="380" font-size="20" fill="#546179">runtime evidence</text>

    <rect x="828" y="294" width="190" height="116" rx="10" fill="#ffffff" stroke="#b7c2d8" stroke-width="3"/>
    <text x="878" y="344" font-size="26" font-weight="700" fill="#172033">Patch</text>
    <text x="850" y="380" font-size="20" fill="#546179">skip dot safely</text>

    <rect x="1078" y="294" width="130" height="116" rx="10" fill="#e9f7f1" stroke="#2c9f7a" stroke-width="3"/>
    <text x="1102" y="344" font-size="26" font-weight="700" fill="#172033">Replay</text>
    <text x="1100" y="380" font-size="20" fill="#546179">no crash</text>

    <path d="M268 352 L316 352" stroke="#3267d6" stroke-width="6" marker-end="url(#arrow)" fill="none"/>
    <path d="M518 352 L566 352" stroke="#3267d6" stroke-width="6" marker-end="url(#arrow)" fill="none"/>
    <path d="M768 352 L816 352" stroke="#3267d6" stroke-width="6" marker-end="url(#arrow)" fill="none"/>
    <path d="M1018 352 L1066 352" stroke="#3267d6" stroke-width="6" marker-end="url(#arrow)" fill="none"/>

    <rect x="356" y="500" width="568" height="76" rx="10" fill="#fff4e0" stroke="#d9922b" stroke-width="3"/>
    <text x="398" y="548" font-size="26" font-weight="700" fill="#172033">Without this pipeline, a report is only a lead.</text>
  </g>
</svg>
