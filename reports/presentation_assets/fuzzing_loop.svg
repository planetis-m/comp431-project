<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Coverage-guided fuzzing loop</title>
  <desc id="desc">Diagram showing seeds, mutation, parser execution, coverage feedback, and crash artifact.</desc>
  <rect width="1280" height="720" fill="#f7f8fb"/>
  <text x="72" y="86" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#172033">Coverage-guided fuzzing loop</text>
  <text x="74" y="126" font-family="Inter, Arial, sans-serif" font-size="22" fill="#546179">libFuzzer keeps inputs that reach new parser paths, then mutates them again.</text>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3267d6"/>
    </marker>
  </defs>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="84" y="250" width="210" height="118" rx="10" fill="#ffffff" stroke="#b7c2d8" stroke-width="3"/>
    <text x="126" y="302" font-size="28" font-weight="700" fill="#172033">Seed corpus</text>
    <text x="126" y="338" font-size="20" fill="#546179">small valid inputs</text>

    <rect x="398" y="250" width="210" height="118" rx="10" fill="#ffffff" stroke="#b7c2d8" stroke-width="3"/>
    <text x="447" y="302" font-size="28" font-weight="700" fill="#172033">Mutate</text>
    <text x="434" y="338" font-size="20" fill="#546179">change bytes</text>

    <rect x="712" y="250" width="210" height="118" rx="10" fill="#ffffff" stroke="#b7c2d8" stroke-width="3"/>
    <text x="750" y="302" font-size="28" font-weight="700" fill="#172033">Run parser</text>
    <text x="751" y="338" font-size="20" fill="#546179">HTTP input paths</text>

    <rect x="1026" y="250" width="210" height="118" rx="10" fill="#fff7e6" stroke="#d9922b" stroke-width="3"/>
    <text x="1074" y="302" font-size="28" font-weight="700" fill="#172033">Observe</text>
    <text x="1060" y="338" font-size="20" fill="#546179">new coverage?</text>

    <path d="M294 309 L386 309" stroke="#3267d6" stroke-width="6" marker-end="url(#arrow)" fill="none"/>
    <path d="M608 309 L700 309" stroke="#3267d6" stroke-width="6" marker-end="url(#arrow)" fill="none"/>
    <path d="M922 309 L1014 309" stroke="#3267d6" stroke-width="6" marker-end="url(#arrow)" fill="none"/>
    <path d="M1131 368 C1131 540 196 540 196 380" stroke="#3267d6" stroke-width="6" marker-end="url(#arrow)" fill="none"/>

    <rect x="444" y="472" width="392" height="86" rx="10" fill="#ffecec" stroke="#c84141" stroke-width="3"/>
    <text x="486" y="526" font-size="28" font-weight="700" fill="#172033">Crash saves exact input</text>
    <path d="M817 368 C817 414 724 433 682 463" stroke="#c84141" stroke-width="6" marker-end="url(#arrow)" fill="none"/>
  </g>
</svg>
