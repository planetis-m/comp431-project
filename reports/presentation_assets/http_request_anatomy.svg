<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">HTTP request anatomy</title>
  <desc id="desc">Diagram showing HTTP request line, headers, blank line, and optional body.</desc>
  <rect width="1280" height="720" fill="#f7f8fb"/>
  <text x="70" y="86" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#172033">What the parser receives</text>
  <text x="72" y="126" font-family="Inter, Arial, sans-serif" font-size="22" fill="#546179">An HTTP request is plain text at the boundary tested by the fuzzer.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="112" y="190" width="1056" height="402" rx="12" fill="#ffffff" stroke="#b7c2d8" stroke-width="3"/>
    <rect x="112" y="190" width="1056" height="92" rx="12" fill="#e7efff"/>
    <rect x="112" y="282" width="1056" height="154" fill="#eef8f3"/>
    <rect x="112" y="436" width="1056" height="52" fill="#fff4e0"/>
    <rect x="112" y="488" width="1056" height="104" rx="12" fill="#f5f1ff"/>

    <text x="154" y="248" font-size="34" font-weight="700" fill="#172033">GET /index.html HTTP/1.1</text>
    <text x="828" y="248" font-size="23" font-weight="700" fill="#3267d6">request line</text>

    <text x="154" y="334" font-size="30" font-family="JetBrains Mono, Consolas, monospace" fill="#172033">Host: example.com</text>
    <text x="154" y="386" font-size="30" font-family="JetBrains Mono, Consolas, monospace" fill="#172033">Content-Length: 12</text>
    <text x="828" y="362" font-size="23" font-weight="700" fill="#2c9f7a">headers</text>

    <text x="154" y="470" font-size="28" fill="#172033">blank line: headers end here</text>
    <text x="828" y="470" font-size="23" font-weight="700" fill="#d9922b">CRLF</text>

    <text x="154" y="550" font-size="30" font-family="JetBrains Mono, Consolas, monospace" fill="#172033">optional body</text>
    <text x="828" y="550" font-size="23" font-weight="700" fill="#6d56b7">body</text>

    <rect x="130" y="612" width="1020" height="54" rx="8" fill="#ffecec" stroke="#c84141" stroke-width="3"/>
    <text x="154" y="648" font-size="24" font-weight="700" fill="#172033">Threat model: an unauthenticated client controls these bytes.</text>
  </g>
</svg>
